{% extends "base.html" %}
 
{% block title %} Lista de Livros {% endblock %}
 
{% block conteudo %}
<div class="card">
    <div class="card-header">
        <a
            name=""
            id=""
            class="btn btn-success"
            href="{% url 'criar' %}"
            role="button"
            >Adicionar novo livro</a
        >
       
    </div>
   
    <div class="card-body">
        <h4 class="card-title">Livros</h4>
        <div
            class="table-responsive"
        >
            <table
                class="table table-primary"
            >
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Título</th>
                        <th scope="col">Imagem</th>
                        <th scope="col">Descrição</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {%for livro in livros %}
                    <tr>
                        <td>{{ livro.id }}</td>
                        <td>{{ livro.titulo }}</td>
                        <td>
                            <img src="{{ livro.imagem.url }}" height="100" />
                        </td>
                        <td>{{ livro.descricao}}</td>
                        <td>
                            <a
                                name=""
                                id=""
                                class="btn btn-info"
                                href="{% url 'alterar' livro.id %}"
                                role="button"
                                >Alterar</a
                            >
                           
                           
                            |
                           
                            <a
                                name=""
                                id=""
                                class="btn btn-danger"
                                href="{% url 'excluir' livro.id %}"
                                role="button"
                                onclick="return confirm('Tem certeza que desseja excluir este livro?');"
                                >Excluir</a
                            >
                           
                       
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
       
       
    </div>
    <div class="card-footer text-body-secondary"></div>
</div>
 
 
{% endblock %}
