<form enctype="multipart/form-data" method="post">
    {% csrf_token %}

    {% for campo in formulario %}
<div class="mb-3">
    <label for="" class="form-label">{{ campo.label }}</label>

    {% if campo.field.widget.input_type == 'file' and campo.value %}
        <br/>
        <img src="{{MEDIA_URL}}/imagens/{{campo.value}}" height="300" />
    {% endif %}


    <input
        type="{{ campo.field.widget.input_type }}"
        class="form-control"
        name="{{ campo.name }}"
        id=""
        aria-describedby="helpId"
        placeholder="{{ campo.label }}"
        value="{{ campo.value | default:'' }}"
    />
   
</div>

{% if campo.errors %}
<div class="col-12help-text" style="color: red;">
    Campo obrigatório.
</div>
{% endif %}

{% endfor %}

 <input name="" id="" class="btn btn-success" type="submit" value="Enviar" />
 <a name="" id="" class="btn btn-primary" href="{% url 'livros' %}">Cancelar</a>
</form>
